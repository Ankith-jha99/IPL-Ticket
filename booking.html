
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 - Book Tickets</title>

    <!-- Link existing CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="booking.html">Book Ticket</a>
    </nav>

    <h1>IPL 2026 Ticket Booking</h1>
    <p>Fill in the details below to book your tickets.</p>

    <!-- Booking Form -->
    <form action="#" method="get">

        <h2>Personal Details</h2>

        <!-- Name -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name"
               minlength="3" maxlength="30"
               required>

        <br><br>

        <!-- Email -->
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email"
               required>

        <br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter 10 digit number"
               pattern="[6-9][0-9]{9}"
               title="Enter a valid 10-digit Indian mobile number"
               required>

        <br><br>

        <h2>Ticket Details</h2>

        <!-- Match Selection -->
        <label for="match">Select Match:</label>
        <select id="match" name="match" required>
            <option value="">-- Select Match --</option>
            <option value="RCB vs CSK">RCB vs CSK</option>
            <option value="MI vs KKR">MI vs KKR</option>
            <option value="CSK vs MI">CSK vs MI</option>
            <option value="RCB vs MI">RCB vs MI</option>
        </select>

        <br><br>

        <!-- Stand Category -->
        <label for="stand">Stand Category:</label>
        <select id="stand" name="stand" required>
            <option value="">-- Select Stand --</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
        </select>

        <br><br>

        <!-- Number of Tickets -->
        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" name="tickets"
               min="1" max="10" required>

        <br><br>

        <!-- Additional Preference -->
        <h2>Additional Preference</h2>

        <label>
            <input type="radio" name="preference"
                   value="Near Boundary" required>
            Near Boundary
        </label>

        <br>

        <label>
            <input type="radio" name="preference"
                   value="Near Pavilion">
            Near Pavilion
        </label>

        <br><br>

        <!-- Buttons -->
        <button type="submit">Submit Booking</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
